{% load static %}
<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ tenant.nombre }}{% endblock %}</title>
    <style>
        :root {
            --primary: #1a1a2e; --accent: #e94560; --bg: #f7f7fb; --card: #ffffff;
            --text: #222; --muted: #777; --border: #e5e5ee;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        header { background: var(--primary); color: #fff; padding: 1.5rem 1rem; text-align: center; }
        header h1 { margin: 0; font-size: 1.6rem; }
        header p { margin: 0.25rem 0 0; opacity: 0.75; font-size: 0.9rem; }
        main { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
        .card h2 { margin-top: 0; font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; }
        .option { display: block; border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem; text-decoration: none; color: var(--text); background: #fff; transition: border-color 0.15s; }
        .option:hover { border-color: var(--accent); }
        .option.selected { border-color: var(--accent); background: #fff5f7; }
        .muted { color: var(--muted); font-size: 0.85rem; }
        .price { color: var(--accent); font-weight: 600; }
        .btn { display: inline-block; background: var(--accent); color: #fff; border: none; padding: 0.7rem 1.4rem; border-radius: 8px; font-size: 1rem; cursor: pointer; text-decoration: none; }
        .btn:hover { opacity: 0.92; }
        .steps { display: flex; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem; color: var(--muted); }
        .steps span.active { color: var(--accent); font-weight: 600; }
        .rating { color: #f5a623; font-size: 0.85rem; }
        label { display: block; margin-bottom: 0.35rem; font-weight: 600; font-size: 0.9rem; }
        input[type=text], input[type=tel] { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.9rem; }
        .day-block { margin-bottom: 0.75rem; }
        .day-block h3 { font-size: 0.9rem; margin-bottom: 0.4rem; }
        .slot-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .slot { border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.7rem; font-size: 0.85rem; cursor: pointer; background: #fff; }
        .slot.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #fdecea; color: #b3261e; padding: 0.6rem 0.9rem; border-radius: 8px; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
<header>
    <h1>{{ tenant.nombre }}</h1>
    <p>Reservá tu turno online</p>
</header>
<main>
    {% if messages %}
    <ul class="messages">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
