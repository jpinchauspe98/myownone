<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar · Panel {{ tenant.nombre }}</title>
    <style>
        :root { --primary: #1a1a2e; --accent: {{ tenant.color_primario|default:"#e94560" }}; --bg: #f5f5fa; --card: #fff; --border: #e5e5ee; --muted: #777; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; width: 100%; max-width: 360px; }
        h1 { font-size: 1.3rem; margin: 0 0 0.25rem; color: var(--primary); }
        p.subtitle { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }
        input { width: 100%; padding: 0.65rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
        button { width: 100%; background: var(--accent); color: #fff; border: none; padding: 0.75rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .error { background: #fdecea; color: #b3261e; padding: 0.6rem 0.9rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>{{ tenant.nombre }}</h1>
    <p class="subtitle">Panel de gestión</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" required autofocus>
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" required>
        <button type="submit">Ingresar</button>
    </form>
</div>
</body>
</html>
